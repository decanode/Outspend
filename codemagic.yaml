workflows:
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Outspend # name of the App Store Connect API key in Codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decanode.outspend
      vars:
        APP_STORE_APPLE_ID: "" # set to the numeric Apple ID of the app in App Store Connect
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: fix/ios-capture-decode-and-dedupe
          include: true
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Run tests
        script: npm test
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/Outspend.xcworkspace" \
            --scheme "Outspend"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
